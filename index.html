<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="pomodoro">
      <div class="set">1/4</div>
      <div class="circle-rap">
        <svg height="300" width="300" class="circle-cnt">
          <circle class="bg-circle" r="150" cx="150" cy="150"></circle>
          <circle class="time-circle" r="150" cx="150" cy="150"></circle>
        </svg>
        <div class="time">00:00</div>
      </div>
      <span class="icon-config" id="toggle-config"
        >*gear icon* Configuration</span
      >
      <div id="drop-cnt" style="display: none">
        <div class="select">
          <label for="work-opt">Times:</label>
          <select id="work-opt" name="work-option" onchange="reset()">
            <option value="20" selected>20 minutes</option>
            <option value="30">30 minutes</option>
            <option value="40">40 minutes</option>
            <option value="50">50 minutes</option>
          </select>
          <label for="set-opt" name="set-option">Sets:</label>
          <select id="set-opt">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
          </select>
          <label for="break-duration">Break(mins):</label>
          <select id="break-duration">
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="15">15</option>
          </select>
        </div>
      </div>
      <div class="mode-text">Mode</div>
      <button class="reset">Reset</button>
      <button class="control">Start</button>
    </div>
    <script src="pomodoro.js"></script>
    <script src="to_do.js"></script>
  </body>
</html>
